{% if pagination.pages > 1 %}
<nav class="pager" aria-label="Sayfalar">
  {% if pagination.has_prev %}<a href="{{ page_url(pagination.prev_num) }}">Yeni yazılar</a>{% else %}<span></span>{% endif %}
  <span class="text-muted small">{{ pagination.page }} / {{ pagination.pages }}</span>
  {% if pagination.has_next %}<a href="{{ page_url(pagination.next_num) }}">Eski yazılar</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
